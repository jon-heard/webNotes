<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Music Notes Piano Roll Demo</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; overflow: hidden; background: #202124; color: #eee; font: 14px system-ui, sans-serif; }
        .editor-area { flex: 1; min-height: 0; }
        #abc-text { display: block; width: 100%; height: 100%; min-height: 0; padding: 14px; resize: none; border: 0; outline: 0; background: #303134; color: #fff; font: 15px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace; tab-size: 2; }
        #abc-text::selection { background: #655b2c; color: #fff; }
        #music-notes-host { flex: none; }
    </style>
</head>
<body>
    <main class="editor-area">
        <textarea id="abc-text" spellcheck="false" aria-label="ABC tune text">X: 1
M: 4/4
L: 1/8
Q: 1/4=120
R: reel
K: C
</textarea>
    </main>
    <div id="music-notes-host"></div>
    <script>
        window.loadMusicNotes = function() {
            if (window.musicNotesLoading) return window.musicNotesLoading;
            const assets = new URL('../../music/', window.location.href);
            const loadScript = src => new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Could not load ${src}`));
                document.head.appendChild(script);
            });
            window.musicNotesLoading = (async () => {
                try {
                    if (!window.ABCJS) await loadScript(new URL('abc.min.js', assets));
                    if (!window.fflate?.unzipSync) await loadScript(new URL('fflate.min.js', assets));
                    if (!window.MusicNotes?.mount) await loadScript(new URL('musicNotes.js', assets));
                    const controller = window.MusicNotes.mount(document.getElementById('abc-text'), document.getElementById('music-notes-host'));
                    await controller.loadSamples();
                    return controller;
                } catch (error) {
                    window.musicNotesLoading = null;
                    throw error;
                }
            })();
            return window.musicNotesLoading;
        };
    </script>
</body>
</html>
